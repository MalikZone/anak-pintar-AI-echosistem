<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-canvas-2" x1="0" y1="0" x2="393" y2="852" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="grad-timer-card" x1="0" y1="0" x2="353" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="grad-clock-out" x1="0" y1="0" x2="353" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-timer" x="-4" y="0" width="361" height="190" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-btn-out" x="-4" y="0" width="361" height="76" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F43F5E" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-nav-2" x="-10" y="-10" width="413" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Screen Frame -->
  <rect width="393" height="852" rx="44" fill="url(#bg-canvas-2)"/>
  <rect width="393" height="852" rx="44" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- ==================== 1. STATUS BAR ==================== -->
  <g id="Status-Bar" class="font-sans">
    <text x="36" y="34" font-size="14" font-weight="600" fill="#0F172A" letter-spacing="-0.2">16:10</text>
    <!-- Dynamic Island -->
    <rect x="136" y="12" width="121" height="32" rx="16" fill="#0F172A"/>
    <circle cx="236" cy="28" r="5" fill="#1E293B"/>
    <circle cx="236" cy="28" r="2.5" fill="#0284C7" opacity="0.6"/>
    
    <!-- Icons -->
    <g transform="translate(315, 23)" fill="#0F172A">
      <rect x="0" y="7" width="3" height="4" rx="0.5"/>
      <rect x="4.5" y="5" width="3" height="6" rx="0.5"/>
      <rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/>
      <rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
      <path d="M 23 1 C 20.2 1 17.7 2 15.7 3.7 L 17 5 C 18.6 3.6 20.7 2.8 23 2.8 C 25.3 2.8 27.4 3.6 29 5 L 30.3 3.7 C 28.3 2 25.8 1 23 1 Z" fill="#0F172A"/>
      <circle cx="23" cy="9.5" r="1.5" fill="#0F172A"/>
      <rect x="34" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#0F172A" stroke-width="1.2"/>
      <rect x="36" y="2.5" width="15" height="7" rx="1.5" fill="#0F172A"/>
      <path d="M 57 3.5 C 57.5 3.8 58 4.3 58 5.5 C 58 6.7 57.5 7.2 57 7.5 Z" fill="#0F172A"/>
    </g>
  </g>

  <!-- ==================== 2. HEADER APP BAR ==================== -->
  <g id="Header-AppBar" class="font-sans" transform="translate(20, 60)">
    <div>
      <text x="0" y="16" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">STATUS KEHADIRAN</text>
      <text x="0" y="38" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Sesi Sedang Berjalan</text>
    </div>

    <!-- Active Live Pulse Badge -->
    <g transform="translate(230, 10)">
      <rect width="123" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <circle cx="15" cy="14" r="4.5" fill="#10B981"/>
      <circle cx="15" cy="14" r="7.5" fill="#10B981" opacity="0.25"/>
      <text x="28" y="18" font-size="10.5" font-weight="700" fill="#065F46" letter-spacing="0.4">AKTIF BEKERJA</text>
    </g>
  </g>

  <!-- ==================== 3. ELAPSED WORK TIMER CARD ==================== -->
  <g id="Elapsed-Timer-Card" class="font-sans" transform="translate(20, 116)">
    <g filter="url(#shadow-timer)">
      <rect width="353" height="165" rx="24" fill="url(#grad-timer-card)"/>
    </g>

    <!-- Subtitle with stopwatch icon -->
    <g transform="translate(20, 20)">
      <circle cx="8" cy="8" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
      <polyline points="8,5 8,8 10.5,8" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
      <text x="20" y="12" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">DURASI KERJA AKTIF</text>
    </g>

    <!-- Digital Large Stopwatch -->
    <g transform="translate(20, 82)">
      <text x="0" y="0" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">07</text>
      <text x="62" y="-4" font-size="34" font-weight="300" fill="#64748B">:</text>
      <text x="82" y="0" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">45</text>
      <text x="144" y="-4" font-size="34" font-weight="300" fill="#64748B">:</text>
      <text x="164" y="0" font-size="44" font-weight="800" fill="#34D399" letter-spacing="-1">22</text>
    </g>

    <text x="24" y="98" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">JAM</text>
    <text x="106" y="98" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">MENIT</text>
    <text x="188" y="98" font-size="9" font-weight="600" fill="#34D399" letter-spacing="1">DETIK</text>

    <!-- Progress to Target Hour Bar -->
    <rect x="20" y="118" width="313" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="118" width="270" height="6" rx="3" fill="#10B981"/>

    <!-- Shift Target Info -->
    <text x="20" y="145" font-size="11" font-weight="500" fill="#94A3B8">Target 8 Jam • Shift berakhir pukul 17:30 WIB</text>
    <text x="333" y="145" font-size="11" font-weight="700" fill="#34D399" text-anchor="end">86%</text>
  </g>

  <!-- ==================== 4. SESSION DETAILS CARD ==================== -->
  <g id="Session-Details-Card" class="font-sans" transform="translate(20, 298)">
    <rect width="353" height="154" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Header Card -->
    <text x="16" y="24" font-size="12" font-weight="700" fill="#0F172A">Rincian Kehadiran Masuk</text>
    <line x1="16" y1="36" x2="337" y2="36" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Row 1: Clock In Time & Status -->
    <g transform="translate(16, 48)">
      <text x="0" y="14" font-size="11" font-weight="500" fill="#64748B">Jam Masuk</text>
      <text x="0" y="32" font-size="14" font-weight="700" fill="#0F172A">08:25 WIB</text>
      <!-- Late or On-time Badge -->
      <rect x="80" y="18" width="84" height="20" rx="10" fill="#ECFDF5"/>
      <text x="122" y="32" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">✓ Tepat Waktu</text>
    </g>

    <!-- Row 2: Location -->
    <g transform="translate(16, 96)">
      <text x="0" y="14" font-size="11" font-weight="500" fill="#64748B">Lokasi Presensi</text>
      <g transform="translate(0, 22)">
        <circle cx="5" cy="5" r="4" fill="#3B82F6"/>
        <text x="14" y="9" font-size="12.5" font-weight="600" fill="#1E293B">Menara Batavia Lt. 18 (GPS Verified)</text>
      </g>
    </g>

    <!-- Selfie Verification Preview Thumbnail -->
    <g transform="translate(283, 50)">
      <rect width="52" height="52" rx="14" fill="#334155"/>
      <!-- Face Silhouette Inside Thumb -->
      <circle cx="26" cy="22" r="11" fill="#64748B"/>
      <path d="M 16 38 C 16 32 20 28 26 28 C 32 28 36 32 36 38 Z" fill="#64748B"/>
      <!-- Small Verified Badge -->
      <circle cx="44" cy="44" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
      <path d="M 41.5 44 L 43.5 46 L 47 42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ==================== 5. DAILY WORK NOTES / LOG ==================== -->
  <g id="Work-Notes-Input" class="font-sans" transform="translate(20, 468)">
    <text x="4" y="12" font-size="12" font-weight="600" fill="#334155">Catatan Pekerjaan Hari Ini (Opsional)</text>
    <rect x="0" y="22" width="353" height="66" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="14" y="44" font-size="12" font-weight="400" fill="#0F172A">Selesai review laporan presensi mingguan dan</text>
    <text x="14" y="62" font-size="12" font-weight="400" fill="#0F172A">koordinasi dispatch shift operasional tim logistik.</text>
  </g>

  <!-- ==================== 6. ACTION BUTTONS (CLOCK OUT & OVERTIME) ==================== -->
  <g id="Action-Buttons" class="font-sans" transform="translate(20, 574)">
    <!-- Primary Clock Out Button -->
    <g filter="url(#shadow-btn-out)">
      <rect width="353" height="56" rx="18" fill="url(#grad-clock-out)"/>
    </g>
    <!-- Log Out / Clock Icon -->
    <g transform="translate(100, 18)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="8"/>
      <polyline points="10,6 10,10 13,10"/>
      <path d="M 14 14 L 18 14"/>
    </g>
    <text x="195" y="35" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">CLOCK OUT (PULANG)</text>

    <!-- Secondary Overtime Button -->
    <g transform="translate(0, 68)">
      <rect width="353" height="46" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="176.5" y="28" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">+ Ajukan Lembur (SPL Hari Ini)</text>
    </g>
  </g>

  <!-- ==================== 7. BOTTOM NAVIGATION DOCK ==================== -->
  <g id="Bottom-Navigation" class="font-sans" transform="translate(0, 756)">
    <g filter="url(#shadow-nav-2)">
      <rect width="393" height="96" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="393" y2="0" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Tab 1: Beranda -->
    <g transform="translate(36, 12)">
      <path d="M 24 6 L 16 13 L 16 23 L 21 23 L 21 17 L 27 17 L 27 23 L 32 23 L 32 13 Z" fill="#64748B"/>
      <text x="24" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Beranda</text>
    </g>

    <!-- Tab 2: Presensi (Active) -->
    <g transform="translate(132, 12)">
      <rect x="0" y="0" width="48" height="32" rx="16" fill="#EEF2FF"/>
      <circle cx="24" cy="16" r="10" stroke="#4F46E5" stroke-width="2" fill="none"/>
      <polyline points="24,11 24,16 28,16" stroke="#4F46E5" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="24" y="44" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="middle">Presensi</text>
    </g>

    <!-- Tab 3: Cuti -->
    <g transform="translate(228, 12)">
      <rect x="15" y="7" width="18" height="17" rx="3" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <line x1="15" y1="12" x2="33" y2="12" stroke="#64748B" stroke-width="1.5"/>
      <line x1="19" y1="5" x2="19" y2="8" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="29" y1="5" x2="29" y2="8" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
      <text x="24" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Cuti</text>
    </g>

    <!-- Tab 4: Profil -->
    <g transform="translate(324, 12)">
      <circle cx="16" cy="11" r="5" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <path d="M 8 23 C 8 19 12 17 16 17 C 20 17 24 19 24 23" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="16" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Profil</text>
    </g>

    <!-- iOS Home Indicator -->
    <rect x="127" y="76" width="139" height="5" rx="2.5" fill="#0F172A"/>
  </g>
</svg>

