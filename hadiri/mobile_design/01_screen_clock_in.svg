<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-canvas" x1="0" y1="0" x2="393" y2="852" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="grad-banner" x1="0" y1="0" x2="353" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="grad-clock-in" x1="0" y1="0" x2="353" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="grad-avatar" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-4" y="0" width="361" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-btn" x="-4" y="0" width="361" height="76" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-nav" x="-10" y="-10" width="413" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Screen Frame -->
  <rect width="393" height="852" rx="44" fill="url(#bg-canvas)"/>
  <rect width="393" height="852" rx="44" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- ==================== 1. STATUS BAR ==================== -->
  <g id="Status-Bar" class="font-sans">
    <text x="36" y="34" font-size="14" font-weight="600" fill="#0F172A" letter-spacing="-0.2">09:41</text>
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="136" y="12" width="121" height="32" rx="16" fill="#0F172A"/>
    <!-- Sensor & Camera inside Island -->
    <circle cx="236" cy="28" r="5" fill="#1E293B"/>
    <circle cx="236" cy="28" r="2.5" fill="#0284C7" opacity="0.6"/>
    
    <!-- Icons: Signal, Wifi, Battery -->
    <g transform="translate(315, 23)" fill="#0F172A">
      <!-- Signal bars -->
      <rect x="0" y="7" width="3" height="4" rx="0.5"/>
      <rect x="4.5" y="5" width="3" height="6" rx="0.5"/>
      <rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/>
      <rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
      <!-- Wifi -->
      <path d="M 23 1 C 20.2 1 17.7 2 15.7 3.7 L 17 5 C 18.6 3.6 20.7 2.8 23 2.8 C 25.3 2.8 27.4 3.6 29 5 L 30.3 3.7 C 28.3 2 25.8 1 23 1 Z" fill="#0F172A"/>
      <circle cx="23" cy="9.5" r="1.5" fill="#0F172A"/>
      <!-- Battery outline & level -->
      <rect x="34" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#0F172A" stroke-width="1.2"/>
      <rect x="36" y="2.5" width="15" height="7" rx="1.5" fill="#0F172A"/>
      <path d="M 57 3.5 C 57.5 3.8 58 4.3 58 5.5 C 58 6.7 57.5 7.2 57 7.5 Z" fill="#0F172A"/>
    </g>
  </g>

  <!-- ==================== 2. HEADER APP BAR ==================== -->
  <g id="Header-AppBar" class="font-sans" transform="translate(20, 60)">
    <!-- Avatar -->
    <rect x="0" y="0" width="48" height="48" rx="24" fill="url(#grad-avatar)"/>
    <text x="24" y="29" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">AM</text>
    <circle cx="42" cy="40" r="5.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>

    <!-- User Info Greeting -->
    <text x="58" y="18" font-size="12" font-weight="500" fill="#64748B">Selamat Pagi 👋</text>
    <text x="58" y="38" font-size="17" font-weight="700" fill="#0F172A" letter-spacing="-0.3">Ahmad Malik</text>

    <!-- Notification Bell Button -->
    <rect x="305" y="4" width="40" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 325 15 C 321.7 15 319 17.7 319 21 L 319 26 L 317 28 L 317 29 L 333 29 L 333 28 L 331 26 L 331 21 C 331 17.7 328.3 15 325 15 Z" fill="#475569"/>
    <path d="M 323 30 C 323 31.1 323.9 32 325 32 C 326.1 32 327 31.1 327 30 Z" fill="#475569"/>
    <circle cx="334" cy="14" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- ==================== 3. ACTIVE SHIFT & LOCATION CARD ==================== -->
  <g id="Active-Shift-Card" class="font-sans" transform="translate(20, 126)">
    <!-- Card Background -->
    <rect width="353" height="96" rx="20" fill="url(#grad-banner)"/>
    
    <!-- Shift Badge -->
    <rect x="16" y="16" width="90" height="22" rx="11" fill="rgba(255, 255, 255, 0.2)"/>
    <text x="61" y="31" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SHIFT REGULER</text>

    <!-- Shift Time -->
    <text x="16" y="60" font-size="16" font-weight="700" fill="#FFFFFF">08:30 - 17:30 WIB</text>
    
    <!-- Location Pill -->
    <g transform="translate(16, 70)">
      <circle cx="6" cy="6" r="4" fill="#34D399"/>
      <text x="16" y="10" font-size="11.5" font-weight="500" fill="#E0E7FF">Kantor Pusat (Dalam Radius 15m)</text>
    </g>

    <!-- Change Shift Button -->
    <rect x="251" y="24" width="86" height="30" rx="15" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
    <text x="294" y="43" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Ganti Shift</text>
  </g>

  <!-- ==================== 4. LIVE CLOCK DISPLAY ==================== -->
  <g id="Live-Clock-Display" class="font-sans" transform="translate(20, 240)">
    <!-- Date Text -->
    <text x="176.5" y="18" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">KAMIS, 24 SEPTEMBER 2026</text>
    
    <!-- Digital Clock Time -->
    <text x="176.5" y="56" font-size="38" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="-1">08:24:15</text>
    <text x="272" y="44" font-size="13" font-weight="700" fill="#4F46E5">WIB</text>
  </g>

  <!-- ==================== 5. SELFIE & FACE SCAN VIEWFINDER ==================== -->
  <g id="Selfie-Viewfinder" class="font-sans" transform="translate(20, 320)">
    <!-- Viewfinder Outer Box -->
    <rect width="353" height="230" rx="24" fill="#0F172A"/>
    
    <!-- Camera View Simulation Background (Blurred Gradient) -->
    <rect x="4" y="4" width="345" height="222" rx="20" fill="#1E293B"/>
    
    <!-- Face Avatar Illustration / Silhouette -->
    <circle cx="176.5" cy="98" r="42" fill="#334155"/>
    <path d="M 140 162 C 140 142 156 128 176.5 128 C 197 128 213 142 213 162 Z" fill="#334155"/>
    
    <!-- Viewfinder Focus Frame Brackets (Corner UI) -->
    <path d="M 90 60 L 70 60 L 70 80" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 263 60 L 283 60 L 283 80" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 70 145 L 70 165 L 90 165" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 283 145 L 283 165 L 263 165" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

    <!-- Scanning Line Effect -->
    <line x1="80" y1="110" x2="273" y2="110" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8"/>

    <!-- Verification Badge Tag -->
    <rect x="86" y="184" width="181" height="30" rx="15" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1"/>
    <circle cx="102" cy="199" r="6" fill="#10B981"/>
    <path d="M 99.5 199 L 101.5 201 L 105 197" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="203" font-size="11" font-weight="600" fill="#34D399">Wajah &amp; GPS Terverifikasi</text>
  </g>

  <!-- ==================== 6. CLOCK IN ACTION BUTTON ==================== -->
  <g id="Action-Clock-In" class="font-sans" transform="translate(20, 568)">
    <g filter="url(#shadow-btn)">
      <rect width="353" height="56" rx="18" fill="url(#grad-clock-in)"/>
    </g>
    <!-- Fingerprint / Hand Icon -->
    <g transform="translate(112, 18)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="10" cy="10" r="8"/>
      <path d="M 10 6 L 10 10 L 13 13"/>
    </g>
    <text x="195" y="35" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">CLOCK IN SEKARANG</text>
  </g>

  <!-- ==================== 7. QUICK STATS SUMMARY ==================== -->
  <g id="Quick-Stats" class="font-sans" transform="translate(20, 642)">
    <!-- Stat 1: Sisa Cuti -->
    <g transform="translate(0, 0)">
      <rect width="109" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" font-size="11" font-weight="600" fill="#64748B">Sisa Cuti</text>
      <text x="14" y="52" font-size="20" font-weight="800" fill="#0F172A">12</text>
      <text x="44" y="51" font-size="11" font-weight="600" fill="#10B981">Hari</text>
    </g>

    <!-- Stat 2: Kehadiran -->
    <g transform="translate(122, 0)">
      <rect width="109" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" font-size="11" font-weight="600" fill="#64748B">Kehadiran</text>
      <text x="14" y="52" font-size="20" font-weight="800" fill="#0F172A">96</text>
      <text x="44" y="51" font-size="12" font-weight="700" fill="#4F46E5">%</text>
    </g>

    <!-- Stat 3: Lembur -->
    <g transform="translate(244, 0)">
      <rect width="109" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" font-size="11" font-weight="600" fill="#64748B">Lembur</text>
      <text x="14" y="52" font-size="20" font-weight="800" fill="#0F172A">4.5</text>
      <text x="50" y="51" font-size="11" font-weight="600" fill="#F59E0B">Jam</text>
    </g>
  </g>

  <!-- ==================== 8. BOTTOM NAVIGATION DOCK ==================== -->
  <g id="Bottom-Navigation" class="font-sans" transform="translate(0, 756)">
    <g filter="url(#shadow-nav)">
      <rect width="393" height="96" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="393" y2="0" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Tab 1: Beranda (Active) -->
    <g transform="translate(36, 12)">
      <rect x="0" y="0" width="48" height="32" rx="16" fill="#EEF2FF"/>
      <!-- Home Icon -->
      <path d="M 24 6 L 16 13 L 16 23 L 21 23 L 21 17 L 27 17 L 27 23 L 32 23 L 32 13 Z" fill="#4F46E5"/>
      <text x="24" y="44" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="middle">Beranda</text>
    </g>

    <!-- Tab 2: Presensi -->
    <g transform="translate(132, 12)">
      <circle cx="24" cy="16" r="10" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <polyline points="24,11 24,16 28,16" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="24" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Presensi</text>
    </g>

    <!-- Tab 3: Cuti -->
    <g transform="translate(228, 12)">
      <!-- Calendar Icon -->
      <rect x="15" y="7" width="18" height="17" rx="3" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <line x1="15" y1="12" x2="33" y2="12" stroke="#64748B" stroke-width="1.5"/>
      <line x1="19" y1="5" x2="19" y2="8" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="29" y1="5" x2="29" y2="8" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
      <text x="24" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Cuti</text>
    </g>

    <!-- Tab 4: Profil -->
    <g transform="translate(324, 12)">
      <!-- User Icon -->
      <circle cx="16" cy="11" r="5" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <path d="M 8 23 C 8 19 12 17 16 17 C 20 17 24 19 24 23" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="16" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Profil</text>
    </g>

    <!-- iOS Home Indicator -->
    <rect x="127" y="76" width="139" height="5" rx="2.5" fill="#0F172A"/>
  </g>
</svg>

