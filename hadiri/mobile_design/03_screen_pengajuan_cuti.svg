<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-canvas-3" x1="0" y1="0" x2="393" y2="852" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="grad-btn-leave" x1="0" y1="0" x2="353" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <linearGradient id="grad-card-active" x1="0" y1="0" x2="110" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-btn-leave" x="-4" y="0" width="361" height="76" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-nav-3" x="-10" y="-10" width="413" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Screen Frame -->
  <rect width="393" height="852" rx="44" fill="url(#bg-canvas-3)"/>
  <rect width="393" height="852" rx="44" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- ==================== 1. STATUS BAR ==================== -->
  <g id="Status-Bar" class="font-sans">
    <text x="36" y="34" font-size="14" font-weight="600" fill="#0F172A" letter-spacing="-0.2">10:30</text>
    <!-- Dynamic Island -->
    <rect x="136" y="12" width="121" height="32" rx="16" fill="#0F172A"/>
    <circle cx="236" cy="28" r="5" fill="#1E293B"/>
    <circle cx="236" cy="28" r="2.5" fill="#0284C7" opacity="0.6"/>
    
    <!-- Icons -->
    <g transform="translate(315, 23)" fill="#0F172A">
      <rect x="0" y="7" width="3" height="4" rx="0.5"/>
      <rect x="4.5" y="5" width="3" height="6" rx="0.5"/>
      <rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/>
      <rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
      <path d="M 23 1 C 20.2 1 17.7 2 15.7 3.7 L 17 5 C 18.6 3.6 20.7 2.8 23 2.8 C 25.3 2.8 27.4 3.6 29 5 L 30.3 3.7 C 28.3 2 25.8 1 23 1 Z" fill="#0F172A"/>
      <circle cx="23" cy="9.5" r="1.5" fill="#0F172A"/>
      <rect x="34" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#0F172A" stroke-width="1.2"/>
      <rect x="36" y="2.5" width="15" height="7" rx="1.5" fill="#0F172A"/>
      <path d="M 57 3.5 C 57.5 3.8 58 4.3 58 5.5 C 58 6.7 57.5 7.2 57 7.5 Z" fill="#0F172A"/>
    </g>
  </g>

  <!-- ==================== 2. HEADER APP BAR ==================== -->
  <g id="Header-AppBar" class="font-sans" transform="translate(20, 56)">
    <!-- Back Button -->
    <rect x="0" y="4" width="40" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 23 16 L 15 24 L 23 32" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Screen Title -->
    <text x="176.5" y="30" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Pengajuan Cuti</text>

    <!-- History / Log Icon Button -->
    <rect x="313" y="4" width="40" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="333" cy="24" r="8" stroke="#475569" stroke-width="1.8" fill="none"/>
    <polyline points="333,20 333,24 336,26" stroke="#475569" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ==================== 3. LEAVE BALANCE QUOTA CARDS ==================== -->
  <g id="Leave-Balance-Cards" class="font-sans" transform="translate(20, 116)">
    <!-- Card 1: Cuti Tahunan (Active Highlight) -->
    <g transform="translate(0, 0)">
      <rect width="112" height="82" rx="18" fill="url(#grad-card-active)"/>
      <text x="12" y="22" font-size="11" font-weight="600" fill="#C7D2FE">Tahunan</text>
      <text x="12" y="52" font-size="24" font-weight="800" fill="#FFFFFF">12</text>
      <text x="44" y="51" font-size="11" font-weight="600" fill="#A5B4FC">Hari</text>
      <text x="12" y="69" font-size="9.5" font-weight="500" fill="#818CF8">Sisa kuota 2026</text>
    </g>

    <!-- Card 2: Cuti Sakit -->
    <g transform="translate(120, 0)">
      <rect width="112" height="82" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="600" fill="#64748B">Sakit</text>
      <text x="12" y="52" font-size="24" font-weight="800" fill="#0F172A">14</text>
      <text x="44" y="51" font-size="11" font-weight="600" fill="#64748B">Hari</text>
      <text x="12" y="69" font-size="9.5" font-weight="500" fill="#10B981">Tersedia penuh</text>
    </g>

    <!-- Card 3: Cuti Khusus -->
    <g transform="translate(240, 0)">
      <rect width="112" height="82" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="600" fill="#64748B">Khusus</text>
      <text x="12" y="52" font-size="24" font-weight="800" fill="#0F172A">5</text>
      <text x="32" y="51" font-size="11" font-weight="600" fill="#64748B">Hari</text>
      <text x="12" y="69" font-size="9.5" font-weight="500" fill="#F59E0B">Menikah/Duka</text>
    </g>
  </g>

  <!-- ==================== 4. LEAVE APPLICATION FORM ==================== -->
  <g id="Leave-Form" class="font-sans" transform="translate(20, 218)">
    
    <!-- Field 1: Tipe Cuti -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" font-size="12" font-weight="600" fill="#334155">Tipe Cuti</text>
      <rect x="0" y="20" width="353" height="48" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <!-- Selected value -->
      <circle cx="24" cy="44" r="5" fill="#4F46E5"/>
      <text x="38" y="49" font-size="13.5" font-weight="600" fill="#0F172A">Cuti Tahunan (Annual Leave)</text>
      <!-- Dropdown Chevron -->
      <path d="M 324 41 L 329 46 L 334 41" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Field 2: Rentang Tanggal (Start & End Date Pickers) -->
    <g transform="translate(0, 84)">
      <!-- Start Date -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#334155">Tanggal Mulai</text>
        <rect x="0" y="20" width="168" height="48" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="14" y="49" font-size="13" font-weight="600" fill="#0F172A">28 Sep 2026</text>
        <!-- Mini calendar icon -->
        <rect x="136" y="36" width="14" height="14" rx="2" stroke="#64748B" stroke-width="1.2" fill="none"/>
        <line x1="136" y1="40" x2="150" y2="40" stroke="#64748B" stroke-width="1.2"/>
      </g>

      <!-- End Date -->
      <g transform="translate(185, 0)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#334155">Tanggal Selesai</text>
        <rect x="0" y="20" width="168" height="48" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="14" y="49" font-size="13" font-weight="600" fill="#0F172A">30 Sep 2026</text>
        <!-- Mini calendar icon -->
        <rect x="136" y="36" width="14" height="14" rx="2" stroke="#64748B" stroke-width="1.2" fill="none"/>
        <line x1="136" y1="40" x2="150" y2="40" stroke="#64748B" stroke-width="1.2"/>
      </g>

      <!-- Total Days Calculation Pill -->
      <g transform="translate(0, 78)">
        <rect width="138" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="10" y="16" font-size="11" font-weight="600" fill="#065F46">⚡ Total: 3 Hari Kerja</text>
      </g>
    </g>

    <!-- Field 3: Alasan Pengajuan -->
    <g transform="translate(0, 198)">
      <text x="0" y="12" font-size="12" font-weight="600" fill="#334155">Alasan Pengajuan Cuti</text>
      <rect x="0" y="20" width="353" height="66" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="14" y="42" font-size="12.5" font-weight="400" fill="#0F172A">Keperluan keluarga dan mendampingi</text>
      <text x="14" y="60" font-size="12.5" font-weight="400" fill="#0F172A">orang tua di luar kota.</text>
    </g>

    <!-- Field 4: Upload Lampiran Dokumen -->
    <g transform="translate(0, 298)">
      <text x="0" y="12" font-size="12" font-weight="600" fill="#334155">Lampiran Dokumen (Opsional)</text>
      <rect x="0" y="20" width="353" height="62" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
      <!-- Upload Icon & Text -->
      <g transform="translate(176.5, 42)" text-anchor="middle">
        <path d="M -8 2 L 0 -6 L 8 2 M 0 -6 L 0 8" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="0" y="24" font-size="11.5" font-weight="600" fill="#4F46E5">Unggah Surat / Bukti Pendukung</text>
      </g>
    </g>
  </g>

  <!-- ==================== 5. SUBMIT ACTION BUTTON ==================== -->
  <g id="Action-Submit-Leave" class="font-sans" transform="translate(20, 612)">
    <g filter="url(#shadow-btn-leave)">
      <rect width="353" height="54" rx="18" fill="url(#grad-btn-leave)"/>
    </g>
    <text x="176.5" y="33" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">KIRIM PENGAJUAN CUTI</text>
  </g>

  <!-- ==================== 6. RECENT LEAVE STATUS PREVIEW ==================== -->
  <g id="Recent-Leave-Preview" class="font-sans" transform="translate(20, 684)">
    <rect width="353" height="58" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(14, 16)">
      <text x="0" y="14" font-size="12" font-weight="700" fill="#0F172A">Cuti Tahunan • 14 - 15 Agu</text>
      <text x="0" y="30" font-size="10.5" font-weight="500" fill="#64748B">2 Hari Kerja • Urusan Pribadi</text>
    </g>
    <!-- Status Badge -->
    <rect x="245" y="18" width="94" height="22" rx="11" fill="#ECFDF5"/>
    <text x="292" y="33" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">✓ Disetujui HR</text>
  </g>

  <!-- ==================== 7. BOTTOM NAVIGATION DOCK ==================== -->
  <g id="Bottom-Navigation" class="font-sans" transform="translate(0, 756)">
    <g filter="url(#shadow-nav-3)">
      <rect width="393" height="96" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="393" y2="0" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Tab 1: Beranda -->
    <g transform="translate(36, 12)">
      <path d="M 24 6 L 16 13 L 16 23 L 21 23 L 21 17 L 27 17 L 27 23 L 32 23 L 32 13 Z" fill="#64748B"/>
      <text x="24" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Beranda</text>
    </g>

    <!-- Tab 2: Presensi -->
    <g transform="translate(132, 12)">
      <circle cx="24" cy="16" r="10" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <polyline points="24,11 24,16 28,16" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="24" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Presensi</text>
    </g>

    <!-- Tab 3: Cuti (Active) -->
    <g transform="translate(228, 12)">
      <rect x="0" y="0" width="48" height="32" rx="16" fill="#EEF2FF"/>
      <rect x="15" y="7" width="18" height="17" rx="3" stroke="#4F46E5" stroke-width="2" fill="none"/>
      <line x1="15" y1="12" x2="33" y2="12" stroke="#4F46E5" stroke-width="1.8"/>
      <line x1="19" y1="5" x2="19" y2="8" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
      <line x1="29" y1="5" x2="29" y2="8" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
      <text x="24" y="44" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="middle">Cuti</text>
    </g>

    <!-- Tab 4: Profil -->
    <g transform="translate(324, 12)">
      <circle cx="16" cy="11" r="5" stroke="#64748B" stroke-width="1.8" fill="none"/>
      <path d="M 8 23 C 8 19 12 17 16 17 C 20 17 24 19 24 23" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="16" y="44" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Profil</text>
    </g>

    <!-- iOS Home Indicator -->
    <rect x="127" y="76" width="139" height="5" rx="2.5" fill="#0F172A"/>
  </g>
</svg>

